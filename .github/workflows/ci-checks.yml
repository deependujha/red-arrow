name: General checks

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-md-links:
    uses: deependujha/utilities/tree/patch-1/.github/workflows/check-md-links.yml@38101c45bcf944b3928a0be792505f508b3d3ec0
    with:
      config-file: ".github/markdown-links-config.json"
      base-branch: "main"
      force-check-all: "yes"
