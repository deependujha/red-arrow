</style><text x="20" y="28" class="t" font-size="15" text-anchor="start" font-weight="600">cp.async: every thread moves its own 16 B</text><text x="480" y="28" class="t" font-size="15" text-anchor="start" font-weight="600">TMA: one thread asks, hardware moves the tile</text><rect x="20" y="50" width="300" height="60" rx="4" class="boxs"/><text x="170" y="85" class="t" font-size="13" text-anchor="middle" font-weight="400">gmem tile</text><rect x="20" y="250" width="300" height="60" rx="4" class="boxs"/><text x="170" y="285" class="t" font-size="13" text-anchor="middle" font-weight="400">smem tile</text><rect x="44" y="170" width="22" height="22" rx="3" class="ac"/><line x1="55" y1="112" x2="55" y2="167" class="ar"/><path d="M55 167 L51.5 158.7 L58.5 158.7 Z" class="arh"/><line x1="55" y1="195" x2="55" y2="247" class="ar"/><path d="M55 247 L51.5 238.7 L58.5 238.7 Z" class="arh"/><rect x="78" y="170" width="22" height="22" rx="3" class="ac"/><line x1="89" y1="112" x2="89" y2="167" class="ar"/><path d="M89 167 L85.5 158.7 L92.5 158.7 Z" class="arh"/><line x1="89" y1="195" x2="89" y2="247" class="ar"/><path d="M89 247 L85.5 238.7 L92.5 238.7 Z" class="arh"/><rect x="112" y="170" width="22" height="22" rx="3" class="ac"/><line x1="123" y1="112" x2="123" y2="167" class="ar"/><path d="M123 167 L119.5 158.7 L126.5 158.7 Z" class="arh"/><line x1="123" y1="195" x2="123" y2="247" class="ar"/><path d="M123 247 L119.5 238.7 L126.5 238.7 Z" class="arh"/><rect x="146" y="170" width="22" height="22" rx="3" class="ac"/><line x1="157" y1="112" x2="157" y2="167" class="ar"/><path d="M157 167 L153.5 158.7 L160.5 158.7 Z" class="arh"/><line x1="157" y1="195" x2="157" y2="247" class="ar"/><path d="M157 247 L153.5 238.7 L160.5 238.7 Z" class="arh"/><rect x="180" y="170" width="22" height="22" rx="3" class="ac"/><line x1="191" y1="112" x2="191" y2="167" class="ar"/><path d="M191 167 L187.5 158.7 L194.5 158.7 Z" class="arh"/><line x1="191" y1="195" x2="191" y2="247" class="ar"/><path d="M191 247 L187.5 238.7 L194.5 238.7 Z" class="arh"/><rect x="214" y="170" width="22" height="22" rx="3" class="ac"/><line x1="225" y1="112" x2="225" y2="167" class="ar"/><path d="M225 167 L221.5 158.7 L228.5 158.7 Z" class="arh"/><line x1="225" y1="195" x2="225" y2="247" class="ar"/><path d="M225 247 L221.5 238.7 L228.5 238.7 Z" class="arh"/><rect x="248" y="170" width="22" height="22" rx="3" class="ac"/><line x1="259" y1="112" x2="259" y2="167" class="ar"/><path d="M259 167 L255.5 158.7 L262.5 158.7 Z" class="arh"/><line x1="259" y1="195" x2="259" y2="247" class="ar"/><path d="M259 247 L255.5 238.7 L262.5 238.7 Z" class="arh"/><rect x="282" y="170" width="22" height="22" rx="3" class="ac"/><line x1="293" y1="112" x2="293" y2="167" class="ar"/><path d="M293 167 L289.5 158.7 L296.5 158.7 Z" class="arh"/><line x1="293" y1="195" x2="293" y2="247" class="ar"/><path d="M293 247 L289.5 238.7 L296.5 238.7 Z" class="arh"/><text x="330" y="186" class="m" font-size="12" text-anchor="start" font-weight="400">128 threads</text><text x="330" y="202" class="m" font-size="12" text-anchor="start" font-weight="400">(8 shown)</text><text x="20" y="340" class="m" font-size="12" text-anchor="start" font-weight="400">each thread computes its own address (TV layout)</text><text x="20" y="358" class="m" font-size="12" text-anchor="start" font-weight="400">done = commit → wait_group → barrier</text><rect x="480" y="50" width="220" height="60" rx="4" class="boxs"/><text x="590" y="85" class="t" font-size="13" text-anchor="middle" font-weight="400">gmem tile</text><rect x="480" y="250" width="220" height="60" rx="4" class="boxs"/><text x="590" y="285" class="t" font-size="13" text-anchor="middle" font-weight="400">smem tile</text><line x1="590" y1="112" x2="590" y2="247" class="ar"/><path d="M590 247 L586.5 238.7 L593.5 238.7 Z" class="arh"/><text x="580" y="186" class="t" font-size="12" text-anchor="end" font-weight="400">whole tile</text><rect x="630" y="150" width="120" height="60" rx="6" clas