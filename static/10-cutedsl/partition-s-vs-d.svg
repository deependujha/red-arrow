<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 245" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Plain copy keeps source and destination maps equal, a shuffling copy does not" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b93a1"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>
  <g font-size="13" font-weight="700" fill="#8b93a1">
    <text x="30" y="26">Plain copy: one map</text>
    <text x="380" y="26">Shuffling copy (e.g. ldmatrix)</text>
  </g>
