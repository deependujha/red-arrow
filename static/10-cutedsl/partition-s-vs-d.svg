    <rect x="30" y="134" width="100" height="28" rx="5"/><rect x="30" y="176" width="100" height="28" rx="5"/>
    <rect x="210" y="50" width="100" height="28" rx="5"/><rect x="210" y="92" width="100" height="28" rx="5"/>
    <rect x="210" y="134" width="100" height="28" rx="5"/><rect x="210" y="176" width="100" height="28" rx="5"/>
    <rect x="380" y="50" width="100" height="28" rx="5"/><rect x="380" y="92" width="100" height="28" rx="5"/>
    <rect x="380" y="134" width="100" height="28" rx="5"/><rect x="380" y="176" width="100" height="28" rx="5"/>
    <rect x="580" y="50" width="100" height="28" rx="5"/><rect x="580" y="92" width="100" height="28" rx="5"/>
    <rect x="580" y="134" width="100" height="28" rx="5"/><rect x="580" y="176" width="100" height="28" rx="5"/>
  </g>
  <g stroke="#8b93a1" stroke-width="1.5" marker-end="url(#g)">
    <line x1="131" y1="64" x2="208" y2="64"/><line x1="131" y1="106" x2="208" y2="106"/>
    <line x1="131" y1="148" x2="208" y2="148"/><line x1="131" y1="190" x2="208" y2="190"/>
  </g>
  <g stroke="#f59e0b" stroke-width="1.5" marker-end="url(#o)">
    <line x1="481" y1="64" x2="578" y2="64"/><line x1="481" y1="64" x2="578" y2="106"/>
    <line x1="481" y1="106" x2="578" y2="148"/><line x1="481" y1="106" x2="578" y2="190"/>
    <line x1="481" y1="148" x2="578" y2="64"/><line x1="481" y1="148" x2="578" y2="106"/>
    <line x1="481" y1="190" x2="578" y2="148"/><line x1="481" y1="190" x2="578" y2="190"/>
  </g>
  <g font-size="11" fill="#8b93a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
