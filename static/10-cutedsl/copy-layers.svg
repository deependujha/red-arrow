<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 150" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The five layers of a CuTe copy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
