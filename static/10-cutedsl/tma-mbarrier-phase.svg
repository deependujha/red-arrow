.ac{fill:#38C2AA}.bc{fill:#E8B43C}.vc{fill:#A88BE2}.vcl{fill:#A88BE2;fill-opacity:.25}.dim{fill:#8C9DAA}}
</style><text x="20" y="28" class="t" font-size="15" text-anchor="start" font-weight="600">One mbarrier round (init count = 1, one 8192 B tile)</text><text x="120.0" y="64" class="t" font-size="12" text-anchor="middle" font-weight="600">init(count=1)</text><rect x="20" y="76" width="200" height="92" rx="8" class="vcl"/><text x="34" y="100" class="t" font-size="13" text-anchor="start" font-weight="600">phase 0</text><text x="34" y="122" class="t" font-size="12" text-anchor="start" font-weight="400">pending arrivals 1</text><text x="34" y="142" class="t" font-size="12" text-anchor="start" font-weight="400">tx 0</text><text x="34" y="160" class="t" font-size="12" text-anchor="start" font-weight="400">waiting</text><line x1="222" y1="122" x2="236" y2="122" class="ar"/><path d="M236 122 L227.7 125.5 L227.7 118.5 Z" class="arh"/><text x="338.0" y="64" class="t" font-size="12" text-anchor="middle" font-weight="600">arrive_and_expect_tx(8192)</text><rect x="238" y="76" width="200" height="92" rx="8" class="vcl"/><text x="252" y="100" class="t" font-size="13" text-anchor="start" font-weight="600">phase 0</text><text x="252" y="122" class="t" font-size="12" text-anchor="start" font-weight="400">pending arrivals 0</text><text x="252" y="142" class="t" font-size="12" text-anchor="start" font-weight="400">tx 8192</text><text x="252" y="160" class="t" font-size="12" text-anchor="start" font-weight="400">waiting</text><line x1="440" y1="122" x2="454" y2="122" class="ar"/><path d="M454 122 L445.7 125.5 L445.7 118.5 Z" class="arh"/><text x="556.0" y="64" class="t" font-size="12" text-anchor="middle" font-weight="600">TMA writes bytes</text><rect x="456" y="76" width="200" height="92" rx="8" class="vcl"/><text x="470" y="100" class="t" font-size="13" text-anchor="start" font-weight="600">phase 0</text><text x="470" y="122" class="t" font-size="12" text-anchor="start" font-weight="400">pending arrivals 0</text><text x="470" y="142" class="t" font-size="12" text-anchor="start" font-weight="400">tx 4096 …</text><text x="470" y="160" class="t" font-size="12" text-anchor="start" font-weight="400">waiting</text><line x1="658" y1="122" x2="672" y2="122" class="ar"/><path d="M672 122 L663.7 125.5 L663.7 118.5 Z" class="arh"/><text x="774.0" y="64" class="t" font-size="12" text-anchor="middle" font-weight="600">last byte lands</text><rect x="674" y="76" width="200" height="92" rx="8" class="vc"/><text x="688" y="100" class="on" font-size="13" text-anchor="start" font-weight="600">phase 1</text><text x="688" y="122" class="on" font-size="12" text-anchor="start" font-weight="400">pending arrivals 1</text><text x="688" y="142" class="on" font-size="12" text-anchor="start" font-weight="400">tx 0</text><text x="688" y="160" class="on" font-size="12" text-anchor="start" font-weight="600">phase 0 done</text><text x="20" y="200" class="m" font-size="12" text-anchor="start" font-weight="400">A phase completes when pending arrivals = 0 AND tx count = 0. The barrier then flips its phase bit and re-arms itself.</text><text x="20" y="220" class="m" font-size="12" text-anchor="start" font-weight="400">mbarrier_wait(mbar, 0) returns once phase 0 is complete. The next tile reuses the barrier: wait on parity 1, then 0, 1, …</text></svg>
