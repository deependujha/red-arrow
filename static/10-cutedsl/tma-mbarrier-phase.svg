.ar{stroke:#14222D;stroke-width:1.6;fill:none}.arh{fill:#14222D}
.ac{fill:#1A8C7B}.bc{fill:#B98300}.vc{fill:#6448A0}.vcl{fill:#6448A0;fill-opacity:.25}
