<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 236" width="892" height="236" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
