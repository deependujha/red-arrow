<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Double buffering overlaps loading the next tile with computing the current one" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="120" y="24" font-size="12" fill="#8b93a1">time →</text>
  <g font-size="12" fill="#8b93a1" text-anchor="end" font-weight="700">
    <text x="110" y="68">copy in flight</text>
    <text x="110" y="128">compute</text>
  </g>
  <g stroke="#8b93a1" stroke-width="1.2">
    <g fill="#4f8cff" fill-opacity="0.2">
      <rect x="120" y="47" width="116" height="34" rx="5"/>
      <rect x="240" y="47" width="116" height="34" rx="5"/>
      <rect x="360" y="47" width="116" height="34" rx="5"/>
    </g>
    <g fill="#22a06b" fill-opacity="0.2">
      <rect x="240" y="107" width="116" height="34" rx="5"/>
      <rect x="360" y="107" width="116" height="34" rx="5"/>
      <rect x="480" y="107" width="116" height="34" rx="5"/>
    </g>
  </g>
  <g stroke="#8b93a1" stroke-dasharray="4 4" stroke-opacity="0.8">
    <line x1="238" y1="38" x2="238" y2="150"/>
    <line x1="358" y1="38" x2="358" y2="150"/>
    <line x1="478" y1="38" x2="478" y2="150"/>
  </g>
  <g font-size="11" fill="#8b93a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="178" y="68">tile 0 → buf 0</text>
    <text x="298" y="68">tile 1 → buf 1</text>
    <text x="418" y="68">tile 2 → buf 0</text>
    <text x="298" y="128">tile 0 (buf 0)</text>
    <text x="418" y="128">tile 1 (buf 1)</text>
    <text x="538" y="128">tile 2 (buf 0)</text>
    <text x="238" y="168">wait_group(1)</text>
    <text x="358" y="168">wait_group(1)</text>
    <text x="478" y="168">wait_group(0)</text>
    <text x="238" y="184">+ barrier</text>
    <text x="358" y="184">+ barrier</text>
    <text x="478" y="184">+ barrier</text>
  </g>
</svg>
