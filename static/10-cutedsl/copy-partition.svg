<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="One thread's share of a 32 by 128 tile across four passes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="p" width="22" height="7" patternUnits="userSpaceOnUse" x="70" y="40">
      <path d="M22 0L0 0 0 7" fill="none" stroke="#8b93a1" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <text x="70" y="28" font-size="12" fill="#8b93a1">gA : (32, 128)    one cell = 8 fp16 = one 128-bit atom call</text>
  <g fill="#f59e0b">
    <rect x="92" y="47" width="22" height="7"/>
    <rect x="92" y="103" width="22" height="7"/>
    <rect x="92" y="159" width="22" height="7"/>
    <rect x="92" y="215" width="22" height="7"/>
  </g>
  <rect x="70" y="40" width="352" height="224" fill="url(#p)" stroke="#8b93a1" stroke-width="2"/>
  <path d="M70 96H422M70 152H422M70 208H422" stroke="#8b93a1" stroke-width="2"/>
  <g font-size="11" fill="#8b93a1" text-anchor="end">
    <text x="62" y="72">pass 0</text>
    <text x="62" y="128">pass 1</text>
    <text x="62" y="184">pass 2</text>
    <text x="62" y="240">pass 3</text>
  </g>
  <text x="70" y="286" font-size="12" fill="#8b93a1">one pass covers (8, 128): 8 rows × 16 threads × 8 values</text>
  <rect x="445" y="61" width="12" height="12" fill="#f59e0b"/>
  <g font-size="11" fill="#8b93a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="463" y="71">thread 17, thr coord (1,1)</text>
    <text x="445" y="100">tXgA = thr_copy.partition_S(gA)</text>
    <text x="445" y="124">shape ≈ ((8), 4, 1)</text>
    <text x="445" y="146">  8 : values per atom call</text>
    <text x="445" y="166">  4 : passes down M</text>
    <text x="445" y="186">  1 : passes across N</text>
    <text x="445" y="214">cute.copy fires the atom 4×</text>
  </g>
</svg>
