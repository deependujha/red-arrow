</style><text x="20" y="28" class="t" font-size="15" text-anchor="start" font-weight="600">Element offset bits, split into zones</text><text x="20" y="48" class="m" font-size="12" text-anchor="start" font-weight="400">shown for fp16 with 16-byte copies: v = 3, L = 6</text><rect x="40" y="110" width="58" height="40" rx="4" class="lz"/><text x="69.0" y="135" class="t" font-size="14" text-anchor="middle" font-weight="600">10</text><rect x="103" y="110" width="58" height="40" rx="4" class="lz"/><text x="132.0" y="135" class="t" font-size="14" text-anchor="middle" font-weight="600">9</text><rect x="166" y="110" width="58" height="40" rx="4" class="src"/><text x="195.0" y="135" class="on" font-size="14" text-anchor="middle" font-weight="600">8</text><rect x="229" y="110" width="58" height="40" rx="4" class="src"/><text x="258.0" y="135" class="on" font-size="14" text-anchor="middle" font-weight="600">7</text><rect x="292" y="110" width="58" height="40" rx="4" class="lz"/><text x="321.0" y="135" class="t" font-size="14" text-anchor="middle" font-weight="600">6</text><rect x="355" y="110" width="58" height="40" rx="4" class="sz"/><text x="384.0" y="135" class="t" font-size="14" text-anchor="middle" font-weight="600">5</text><rect x="418" y="110" width="58" height="40" rx="4" class="dst"/><text x="447.0" y="135" class="on" font-size="14" text-anchor="middle" font-weight="600">4</text><rect x="481" y="110" width="58" height="40" rx="4" class="dst"/><text x="510.0" y="135" class="on" font-size="14" text-anchor="middle" font-weight="600">3</text><rect x="544" y="110" width="58" height="40" rx="4" class="vz"/><text x="573.0" y="135" class="t" font-size="14" text-anchor="middle" font-weight="600">2</text><rect x="607" y="110" width="58" height="40" rx="4" class="vz"/><text x="636.0" y="135" class="t" font-size="14" text-anchor="middle" font-weight="600">1</text><rect x="670" y="110" width="58" height="40" rx="4" class="vz"/><text x="699.0" y="135" class="t" font-size="14" text-anchor="middle" font-weight="600">0</text><path d="M40 160 v8 H350 v-8" class="arr"/><text x="195.0" y="186" class="t" font-size="13" text-anchor="middle" font-weight="600">line bits</text><text x="195.0" y="204" class="m" font-size="12" text-anchor="middle" font-weight="400">which 128 B line (not the bank)</text><path d="M355 160 v8 H539 v-8" class="arr"/><text x="447.0" y="186" class="t" font-size="13" text-anchor="middle" font-weight="600">slot bits</text><text x="447.0" y="204" class="m" font-size="12" text-anchor="middle" font-weight="400">which 16 B slot of the line</text><path d="M544 160 v8 H728 v-8" class="arr"/><text x="636.0" y="186" class="t" font-size="13" text-anchor="middle" font-weight="600">vector bits</text><text x="636.0" y="204" class="m" font-size="12" text-anchor="middle" font-weight="400">inside one copy</text><path d="M226.5 106 C 226.5 70, 478.5 70, 478.5 102" class="arr"/><path d="M472.5 96 L478.5 107 L484.5 96 Z" class="arrh"/><text x="352.5" y="72" class="t" font-size="12" text-anchor="middle" font-weight="400">XOR, shifted right by S</text><rect x="20" y="228" width="14" height="14" rx="3" class="src"/><text x="40" y="240" class="t" font-size="13" text-anchor="start" font-weight="400">source: line bits that vary inside the phase (B of them, lowest = M + S)</text><rect x="20" y="252" width="14" height="14" rx="3" class="dst"/><text x="40" y="264" class="t" font-size="13" text-anchor="start" font-weight="400">destination: slot bits that stay constant inside the phase (lowest = M)</text><text x="20" y="290" class="m" font-size="12" text-anchor="start" font-weight="400">Illustrated here with B = 2, M = 3, S = 4: bits 7–8 are XORed into bits 3–4.</text></svg>
